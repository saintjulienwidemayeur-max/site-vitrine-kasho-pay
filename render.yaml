# Render Blueprint for the showcase site (static, no build step).
# Create it from the Render dashboard: New > Static Site > this repository, Publish Directory = ., Build Command empty.
# Or use this file: New > Blueprint.
services:
  - type: web
    name: kasho-pay-site
    runtime: static
    staticPublishPath: .
    headers:
      - path: /img/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
